<svg width="220" height="48" viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PredictFlow">
  <defs>
    <linearGradient id="pfBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#298DFF"/>
      <stop offset="1" stop-color="#0E6FE6"/>
    </linearGradient>
  </defs>
  <!-- mark tile -->
  <rect x="0" y="4" width="40" height="40" rx="11" fill="url(#pfBlue)"/>
  <!-- research node branching into two binary outcomes -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round">
    <path d="M13 24 C 21 24, 23 15, 31 15"/>
    <path d="M13 24 C 21 24, 23 33, 31 33"/>
  </g>
  <circle cx="13" cy="24" r="3.6" fill="#FFFFFF"/>
  <circle cx="31" cy="15" r="3" fill="#FFFFFF"/>
  <circle cx="31" cy="33" r="3" fill="#FFFFFF"/>
  <!-- wordmark -->
  <text x="52" y="31" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.4">
    <tspan fill="#081C2E">Predict</tspan><tspan fill="#298DFF">Flow</tspan>
  </text>
</svg>
